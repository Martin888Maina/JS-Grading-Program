<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>
<style>
    input{
        width: 80%;
    }

</style>
<body>

    <h1 class="text-center pb-5">JAVASCRIPT STUDENT GRADING SYSTEM PROGRAM</h1>

    <div class="container text-center">
        <form>
                <!-- Student Name section -->
                <div>
                    <label>Name</label>
                    <input type="text"  id="name" placeholder="Please insert Student Name:"  >
                </div>

                <!-- line breaks section -->
                <br>
                <br>
                <br>

                 <!-- Student Grade section -->
                <div>
                    <label>Grade</label>
                    <input type="number" id="grade" placeholder="Please insert Student Grade:" >
                </div>

                <!-- line breaks section -->
                <br>
                <br>
                <br>

                <!-- Result section -->
                <div>
                    <label>Result</label>
                    <input type="text" id="stmt">
                </div>

                <!-- line breaks section -->
                <br>
                <br>
                <br>

                <div>
                    <!-- submit button -->
                    <button type="button" id="mybtn" class="btn btn-lg btn-info" onclick = "displayfullName()">CLICK HERE</button>
                </div>

                <!-- line breaks section -->
                <br>
                <br>
                <br>


        </form>
    </div>

<script>
            function displayfullName() {

                    let studentName   = document.getElementById("name").value;
                    let studentGrade  = document.getElementById("grade").value;
                    let message       = ""; 

                    // Use if-else statements to determine the message
                    if (studentGrade >= 80 && studentGrade <= 100) {
                        message = "distinction";
                       
                    } else if (studentGrade >= 60 && studentGrade <= 79) {
                        message = "credit";
                       
                    } else if (studentGrade >= 50 && studentGrade <= 59) {
                        message = "pass";
                        
                    } else if (studentGrade >= 40 && studentGrade<= 49) {
                        message = "satisfactory";
                    
                    } else if (studentGrade< 40) {
                        message = "fail";
                        
                    } else{
                        message = "invalid Input";
                    }

                    document.getElementById("stmt").value = message;

        }


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</body>
</html>
